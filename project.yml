name: BabyFirstWords
options:
  bundleIdPrefix: com.martinespericueta
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BabyFirstWords:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyFirstWords
        excludes:
          - "Resources/Audio/**"
      - path: BabyFirstWords/Resources/Audio
        type: folder
    info:
      path: BabyFirstWords/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Baby First Words
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinespericueta.BabyFirstWords
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  BabyFirstWords:
    build:
      targets:
        BabyFirstWords: all
    run:
      config: Debug
